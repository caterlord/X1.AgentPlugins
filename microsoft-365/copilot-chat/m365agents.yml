version: v1.12
environmentFolderPath: ./env

provision:
  - uses: teamsApp/create
    with:
      name: X1 HQ Pilot
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  - uses: oauth/register
    with:
      name: X1 HQ Copilot Chat Pilot
      appId: ${{TEAMS_APP_ID}}
      applicableToApps: AnyApp
      targetAudience: HomeTenant
      clientId: ${{X1_MCP_CLIENT_ID}}
      clientSecret: ${{SECRET_X1_MCP_CLIENT_SECRET}}
      authorizationUrl: https://clerk.posx1.ai/oauth/authorize
      tokenUrl: https://clerk.posx1.ai/oauth/token
      refreshUrl: https://clerk.posx1.ai/oauth/token
      scope: settings.read,reports.read
      flow: authorizationCode
      identityProvider: Custom
      isPKCEEnabled: true
      tokenExchangeMethodType: BasicAuthorizationHeader
      baseUrl: https://x1hq-mcp-staging.azurewebsites.net/mcp
    writeToEnvironmentFile:
      configurationId: X1_MCP_AUTH_ID

  - uses: teamsApp/validateManifest
    with:
      manifestPath: ./appPackage/manifest.json

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: copilotAgent/publish
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      scope: personal
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
